# OSV-Scanner configuration.
#
# Accepted, justified vulnerability exceptions for the Astro/Starlight catalog
# site's package-lock.json (the only lockfile in this repo). Each entry is a
# deliberate risk decision, not a silent suppression: no fix reachable within
# the upstream dependency ranges, and no untrusted input reaching the affected
# code. Revisit on each release and on every dependency bump; remove an entry
# as soon as the fix becomes resolvable.
#
# Advisories with a fixed release outside an upstream range (katex,
# postcss-selector-parser) are fixed via package.json `overrides`, not waived.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
# braces 3.0.3: stack-exhaustion DoS on deeply nested brace patterns. No fixed
# release exists (3.0.3 is the last affected and latest version). Build-time
# only, via starlight-llms-txt -> micromatch (^3.0.3), where the patterns come
# from this repo's own build config, never from user input; not part of the
# deployed static site. Remove this entry once a fixed braces release ships.
reason = "No fixed braces release exists; build-time-only transitive (starlight-llms-txt -> micromatch) matching repo-authored patterns, never untrusted input; no production exposure. Revisit when braces ships a fix."
