---
name: CI

# Continuous integration: pin-check + workflow lint, thin callers of the central
# modeled-information-format/.github reusables (pinned by the .github repo's commit SHA).

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every `uses:` MUST be a full 40-char commit SHA; thin caller of the central
  # pin-check reusable (never reinvented).
  # modeled-information-format/.github main @ c72b3fae (resolved 2026-11-24)
  pin-check:
    permissions:
      contents: read
    uses: >-
      modeled-information-format/.github/.github/workflows/pin-check.yml@c72b3fae829318990ba3da9b9d5ea0671ac5151f
  # Centralized, verified actionlint fetch.
  # modeled-information-format/.github main @ c72b3fae (resolved 2026-11-24; carries the #6 in-step PATH fix)
  validate-workflows:
    permissions:
      contents: read
    uses: >-
      modeled-information-format/.github/.github/workflows/reusable-actionlint.yml@c72b3fae829318990ba3da9b9d5ea0671ac5151f